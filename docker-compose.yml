services:
  ficheeuro:
    build: .
    container_name: ficheeuro
    restart: unless-stopped
    network_mode: host
    environment:
      - PORT=10100
      - SITE_BRAND=eu
      - VAR_DIR=/app/var
    volumes:
      - ./var:/app/var
      # data/ is rebuilt daily on the host from Sluice artifacts (see
      # scripts/refresh-data.sh + /root/bin/fiche-refresh). Bind-mounting it means
      # a refresh is a restart, not an image rebuild — the image still carries a
      # copy (COPY data ./data) so it runs standalone.
      - ./data:/app/data
